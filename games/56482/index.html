    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

<body>

	<div id="game"></div>
	<div id="orientation"></div>

	<script type="text/javascript">
		window["SDK_OPTIONS"] = {
			"gameId": "azw4229kwthheq313u8j1g42cjvm6c7x",
			"onEvent": function (event) {
				switch (event.name) {
					case "SDK_GAME_START":
						GardenCollapse.adshowing = false;
						GardenCollapse.isPaused = false;
						if (GardenCollapse.soundbtnclicks == false) {
							console.log(GardenCollapse.soundReady, "soundsss");
							if (GardenCollapse.soundReady == false) {
								GardenCollapse.music.play();
								GardenCollapse.soundReady = true;
							}
						}
						// advertisement done, resume game logic and unmute audio
						break;
					case "SDK_GAME_PAUSE":
						GardenCollapse.adshowing = true;
						GardenCollapse.isPaused = true;
						if (GardenCollapse.soundReady == true) {
							GardenCollapse.music.pause();
							GardenCollapse.soundReady = false;
						}
						// pause game logic / mute audio
						break;
					case "SDK_GDPR_TRACKING":
						// this event is triggered when your user doesn't want to be tracked
						break;
					case "SDK_GDPR_TARGETING":
						// this event is triggered when your user doesn't want personalised targeting of ads and such
						break;
				}
			},
		};
		(function (a, b, c) {
			var d = a.getElementsByTagName(b)[0];
			a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
		})(document, "script", "gamemonetize-sdk");
		(function () {

			//	Create your Phaser game and inject it into the game div.
			//	We did it in a window.onload event, but you can do it anywhere (requireJS load, anonymous function, jQuery dom ready, - whatever floats your boat)
			//	We're using a game size of 1024 x 768 here, but you can use whatever you feel makes sense for your game of course.
			//var game = new Phaser.Game(960, 540, Phaser.AUTO, 'game');
			var game = new Phaser.Game(960, 540, Phaser.CANVAS, 'game', null, true);

			//	Add the States your game has.
			//	You don't have to do this in the html, it could be done in your Boot state too, but for simplicity I'll keep it here.
			game.state.add('Boot', GardenCollapse.Boot);
			game.state.add('Preloader', GardenCollapse.Preloader);
			game.state.add('MainMenu', GardenCollapse.MainMenu);
			game.state.add('Help', GardenCollapse.Help);
			game.state.add('Game', GardenCollapse.Game);
			game.state.add('Levelup', GardenCollapse.Levelup);
			game.state.add('Gameover', GardenCollapse.Gameover);
			game.state.add('Gamewon', GardenCollapse.Gamewon);
			//	Now start the Boot state.
			game.state.start('Boot');

		})();
	</script>
