    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

	<div id="game"></div>

	<script type="text/javascript">

		/////GameDistribution API start

		window["SDK_OPTIONS"] = {
			"gameId": "ci3ya81zzr2zg9gykhbd1s5276xx3pig",
			"onEvent": function (event) {
				switch (event.name) {
					case "SDK_GAME_START":
						console.log("unpause")

						BasicGame.adshowing = false;
						BasicGame.paused = false;
						//	if (BasicGame.soundbtnclicks == false) {
						console.log(BasicGame.soundplay, "soundssssss")
						if (BasicGame.soundplay == 1) {

							BasicGame.music.play();
							BasicGame.soundplay = 0;
						}
						//}


						break;
					case "SDK_GAME_PAUSE":
						console.log("pause", BasicGame.sound)
						BasicGame.paused = true;
						BasicGame.adshowing = true;
						//if (BasicGame.sound == 0) {
						///console.log(",mmmm")
						BasicGame.music.pause();
						console.log(BasicGame.soundplay, "sound")
						BasicGame.soundplay = 1;
						//}
						break;
					case "SDK_READY":
						console.log("SDK_READY", BasicGame.soundplay)
						break;
				}
			},
		};
		(function (a, b, c) {
			var d = a.getElementsByTagName(b)[0];
			a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
		})(document, "script", "gamemonetize-sdk");

		(function () {
			BasicGame.srx = Math.max(window.innerWidth, window.innerHeight);
			BasicGame.sry = Math.min(window.innerWidth, window.innerHeight);


			if (BasicGame.srx > 960) {
				BasicGame.screen = "large";
				BasicGame.gameWidth = 1920;

				BasicGame.logicWidth = 1920;
				BasicGame.logicHeight = 1080;
			} else {

				BasicGame.screen = "small";
				BasicGame.gameWidth = 960;

				BasicGame.logicWidth = 960;
				BasicGame.logicHeight = 540;
			}
			var r = BasicGame.logicWidth / BasicGame.logicHeight;

			BasicGame.gameHeight = BasicGame.gameWidth / r;
			//We need these methods later to convert the logical game position to display position, So convertWidth(logicWidth) will be right edge for all screens
			BasicGame.convertWidth = function (value) {
				return value / this.logicWidth * this.gameWidth;
			};
			BasicGame.convertHeight = function (value) {
				return value / this.logicHeight * this.gameHeight;
			};

			//	Create your Phaser game and inject it into the game div.
			//	We did it in a window.onload event, but you can do it anywhere (requireJS load, anonymous function, jQuery dom ready, - whatever floats your boat)
			//	We're using a game size of 1024 x 768 here, but you can use whatever you feel makes sense for your game of course.
			var game = new Phaser.Game(960, 540, Phaser.CANVAS, 'game');
			//	document.getElementById('overlay').style.display = "none";

			//	Add the States your game has.
			//	You don't have to do this in the html, it could be done in your Boot state too, but for simplicity I'll keep it here.
			game.state.add('Boot', BasicGame.Boot);
			game.state.add('Preloader', BasicGame.Preloader);
			game.state.add('MainMenu', BasicGame.MainMenu);

			game.state.add('Game', BasicGame.Game);
			game.state.add('Gameover', BasicGame.Gameover);
			game.state.add('Levelup', BasicGame.Levelup);
			game.state.add('LevelMap', BasicGame.LevelMap);
			game.state.add('Gamewon', BasicGame.Gamewon);
			game.state.add('Level1s', BasicGame.Level1s);
			game.state.add('Level2', BasicGame.Level2);
			game.state.add('Level3', BasicGame.Level3);
			game.state.add('Level4', BasicGame.Level4);
			game.state.add('Level5', BasicGame.Level5);
			game.state.add('Level6', BasicGame.Level6);
			game.state.add('Level7', BasicGame.Level7);
			game.state.add('Level8', BasicGame.Level8);

			game.state.add('Level9', BasicGame.Level9);
			game.state.add('Level10', BasicGame.Level10);
			game.state.add('Level11', BasicGame.Level11);
			game.state.add('Level12', BasicGame.Level12);
			game.state.add('Level13', BasicGame.Level13);
			game.state.add('Level14', BasicGame.Level14);
			game.state.add('Level15', BasicGame.Level15);
			game.state.add('Level16', BasicGame.Level16);
			game.state.add('Level17', BasicGame.Level17);
			game.state.add('Level18', BasicGame.Level18);
			game.state.add('Level19', BasicGame.Level19);
			game.state.add('Level20', BasicGame.Level20);
			game.state.add('Level1s', BasicGame.Level1s);

			//	Now start the Boot state.
			game.state.start('Boot');

		})();
	</script>
