    <div id='game'></div>   
    <div id=canvasHolder></div>

	<script>
		var check_sound = false;
		function initGameDistributionSDK(scene){

			window.SDK_OPTIONS = {
                gameId: "kv6grc9qcre1o5mxgymq19scg46c8wvn",
                onEvent: function (a) {
                    switch (a.name) {
                        case "SDK_GAME_PAUSE":
                            // pause game logic / mute audio
							scene.sound.pauseAll();
							check_sound = false
                            break;
                        case "SDK_GAME_START":
                            // advertisement done, resume game logic and unmute audio
							check_sound = true
							scene.sound.resumeAll();
                            break;
                        case "SDK_READY":
                            // when sdk is ready
                            break;
                    }
                }
            };
            (function (a, b, c) {
                var d = a.getElementsByTagName(b)[0];
                a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
            })(document, "script", "gamemonetize-sdk");
		}
		
		function show_ad(){
			if (typeof sdk !== 'undefined' && sdk.showBanner !== 'undefined') {
				sdk.showBanner();
			}
		}

		var gamesAPI = {
			config:{
				url: "https://www.willinggames.com/?utm_source=gm&utm_medium=2024_block_merge",
				show_more_btn: true,
				tStamp: '2024/10/17',
				storageKey: 'wg_' + (document.title).toLowerCase().replace(/ /gm, '_') + '_'
			}
		}


		function SoundPlay(scene, sound_name) {
			if (!check_sound) {
				return;
			}

			if (sound_name == "bg_music") {
				let music = scene.sound.add(sound_name);

				music.play();

				music.setLoop(true);
			} else {
				scene.sound.play(sound_name);
			}
		}


	</script>
    <script src="phaser.min.js"></script>
    <script src='main.js' type='module'></script>
