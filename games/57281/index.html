<!DOCTYPE html>
<html lang="en">
<head>

     <script type = "text/javascript" >
   window.SDK_OPTIONS = {
      gameId: "wh6wjs0rik5apfr88fmrhsmevw070fsf", // Fill the game_id
      onEvent: function (a) {
         switch (a.name) {
            case "SDK_GAME_PAUSE":
               // pause game logic / mute audio
               break;
            case "SDK_GAME_START":
               // advertisement done, resume game logic and unmute audio
               break;
            case "SDK_READY":
               // when sdk is ready
               break;
            case "SDK_ERROR":
               // when sdk get error
               break;
         }
      }
   };
(function (a, b, c) {
   var d = a.getElementsByTagName(b)[0];
   a.getElementById(c) || (a = a.createElement(b), a.id = c, 
   a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
})(document, "script", "gamemonetize-sdk"); 
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Puzzle Game</title>
    <link rel="stylesheet" href="styles.css">

    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

  </head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Tile Puzzle Game</h1>
            <div class="controls">
                <span id="moves">Moves: 0</span>
                <span id="timer">Time: 120s</span>
                <span id="level">Level: 1</span>
                <button id="pause-resume" class="btn btn-pause">Pause</button>
                <button id="mute-toggle" class="btn btn-mute">🔈</button>
            </div>
        </div>
        <div id="puzzle-grid" class="grid"></div>
        <div id="game-over" class="game-over hidden">
            <h2 id="game-over-message">You Lose!</h2>
            <button id="retry" class="btn btn-retry">Retry</button>
        </div>
        <button id="start" class="btn btn-start">Start Game</button>
        <audio id="background-music" src="music/background-music.mp3" loop></audio>
        <audio id="click-sound" src="music/click-sound.mp3"></audio>
        <audio id="game-over-sound" src="music/game-over-sound.mp3"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
