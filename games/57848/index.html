<!DOCTYPE html>
<html>
	<head><script src="wortal-data.js" type="application/javascript"></script>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
		<script src="lib/createjs.1.0.0.min.js?v=1.0.0"></script>
		<script src="lib/howler.core.2.2.3.min.js?v=2.2.3"></script>
		<script src="lib/pixi-legacy.5.3.9.min.js?v=5.3.9"></script>
		<script src="lib/Pixim.min.js?v=1.14.0"></script>
		<script src="lib/Pixim-animate-container.min.js?v=1.4.0"></script>
	
    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

  </head>
	<body style="margin:0px; overflow: hidden; background-color:#000000;">
		<script src="lib/SCG-h5gp-pixim.min.js?v=1.10.18-2"></script>
		<script>
			SCG.init ( {
				basepath : './',
				version : '202304211350' ,
				pixiOptions : { resolution : 2 }				
			} , {
				sdk: "https://storage.googleapis.com/cdn-wortal-ai/v2/wortal-core.js",
				contentKey: "colorfulassort",
				shareOptions: {
					image: "pf/share.jpg",
					text: "Let's play with me!",
					caption: "Play",
					iconOptions: {
						src: "pf/shareIcon.png",
						size: 0.1,
						top: 0.1,
						left: 0
					}
				}
			} , {
				languages: [ 'en' ],
				languageOptions: 'language.json'
			} ) ;
		</script>
		<script src="bundle.js?v=202304211350"></script>
	</body>
</html>
